services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fplx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fplx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fplx} -d ${POSTGRES_DB:-fplx}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fplx}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-fplx}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DEV_MODE: ${DEV_MODE:-false}
      DEV_USER_WALLET: ${DEV_USER_WALLET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
      # Next.js inlines NEXT_PUBLIC_* into the client bundle at build time,
      # so this has to be a build arg, not a runtime environment var — it
      # must point wherever the browser can reach the API from (not the
      # in-network "app" hostname).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - app
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
